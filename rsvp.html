<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RSVP | Schmidt Wedding 2023</title>

    <!-- Import Fonts -->
    <link rel="stylesheet" href="https://use.typekit.net/duw1hbv.css">

    <!-- Import CSS -->
    <link rel="stylesheet" type="text/css" href="scss/style.css">

</head>
<body>

<main role="main">
    <section class="invite-hero">
        <div class="container">
            <div class="text-wrap ta-center">
                <p class="small-title">Celebrate with us in La Jolla, CA</p>
                <h1 class="h1">Add flight information & dates</h1>
            </div>
            <div class="divider"></div>
            <p class="ta-center">Please add your flight information and travel dates so we can plan everyone’s arrival!</p>

            <div class="form-wrap">
                <form id="rsvp-form" action="https://script.google.com/macros/s/AKfycbwVsE6eblZn4qlrfhY38fHbWVLCpt3m2A9yBoBt8BSCp5M4692E_b7SoKrTIYprN-E/exec" method="POST">
                    <div class="input-wrap">
                        <label for="guest-name">Your Name(s)</label>
                        <input data-id="guest-name" id="guest-name" name="name" type="text" placeholder="Enter your name(s)">
                    </div>
                    <div class="input-wrap">
                        <label for="flight-arrival--date">Flight arrival date</label>
                        <input data-id="flight-arrival--date" id="flight-arrival--date" name="arrivalDate" value="2023-10-18" type="date">
                    </div>
                    <div class="input-wrap">
                        <label for="flight-arrival--time">Flight arrival time</label>
                        <input data-id="flight-arrival--time" id="flight-arrival--time" name="arrivalTime" type="time" value="13:00">
                    </div>
                    <div class="input-wrap">
                        <label for="flight-arrival--number">Flight airline & number</label>
                        <input data-id="flight-arrival--number" id="flight-arrival--number" name="airlineNumber" type="text" placeholder="Enter your airline & number">
                    </div>
                    <div class="input-wrap">
                        <label for="departure--date">Departure date</label>
                        <input data-id="departure--date" id="departure--date" name="departureDate" value="2023-10-22" type="date">
                    </div>
                    <div class="input-wrap">
                        <label for="departure--time">Departure time</label>
                        <input data-id="departure--time" id="departure--time" name="departureTime" type="time" value="13:00">
                    </div>
                    <div class="radio-button-group-wrap">
                        <label>Are you renting a car?</label>
                        <div class="radio-button-group flex" role="radiogroup">
                            <div class="radio-button-wrap flex flex-align-center">
                                <input data-id="car-rental--yes" type="radio" name="carRental" value="yes" id="yes">
                                <label for="yes">Yes</label>
                            </div>
                            <div class="radio-button-wrap flex flex-align-center">
                                <input data-id="car-rental--no" type="radio" name="carRental" value="no" id="no">
                                <label for="no">No</label>
                            </div>
                        </div>
                    </div>
                    <div class="btn-wrap flex-jc-center">
                        <button type="submit" id="submit-form" class="btn">Submit</button>
                    </div>
                </form>
            </div>

        </div>
    </section>

</main>

<footer>
    <div class="footer-container container flex flex-jc-between">
        <div class="footer-link">
            <a href="/itinerary.html">Itinerary</a>
        </div>
        <div class="footer-link">
            <a href="/our-story.html">Our Story</a>
        </div>
        <div class="footer-link">
      <a href="./registry.html" target="_blank">Registry</a>
    </div>
        <div class="footer-link">
      <a href="https://fb.me/25ir13Esiap79QH" target="_blank">Live Stream</a>
    </div>
    </div>
</footer>

<!-- Import Scripts -->
<script src="scripts.js"></script>

<script>
    // Get invitee name from sessionStorage
    let name = document.querySelector("input[name='name']")
    name.value = sessionStorage.getItem("inviteeName")

    // Send form data to Google Sheets
    document.getElementById("rsvp-form").addEventListener("submit", function(event) {
        document.getElementById("submit-form").innerHTML = "Sending..."
        document.getElementById("submit-form").classList.add("sending")
        event.preventDefault(); // Prevent form submission
        var form = event.target;
        var formData = new FormData(form);

        // Optional: You can perform form validation here before submitting

        // Send the form data using fetch
        fetch(form.action, {
            method: "POST",
            body: formData
        })
            .then(function(response) {
                if (response.ok) {
                    // Successful form submission
                    window.location.href = "rsvp-success.html"; // Redirect to a new page
                } else {
                    // Handle errors if needed
                }
            })
            .catch(function(error) {
                // Handle network errors if needed
            });
    });

</script>

</body>
</html>
